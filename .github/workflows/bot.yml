name: AI Compound Bot

on:
  workflow_dispatch:

  schedule:
    - cron: '0 20 * * 5'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Strategy
        run: |
          python strategy.py

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: report.txt
